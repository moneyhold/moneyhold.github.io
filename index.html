<style>
/* Layout: one phone-width column, passbook-style ledger rows, bottom tab bar + add button */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface2:#e2e9e5; --fg:#16201c; --muted:#5b6a63; --line:#d2dbd6;
  --accent:#1d6b57; --accent-soft:#d6ebe3; --accent-ink:#ffffff; --in:#2456b3; --warn:#a24a17; --warn-soft:#f8e3d5; --danger:#b3261e;
  --display:"Gowun Batang", "Nanum Myeongjo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --num:"IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#171f1c; --surface2:#202a26; --fg:#e5ece8; --muted:#92a199; --line:#2b3732;
  --accent:#52b896; --accent-soft:#1c3a30; --accent-ink:#06120d; --in:#82abff; --warn:#f2995e; --warn-soft:#3a2416; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#171f1c; --surface2:#202a26; --fg:#e5ece8; --muted:#92a199; --line:#2b3732;
  --accent:#52b896; --accent-soft:#1c3a30; --accent-ink:#06120d; --in:#82abff; --warn:#f2995e; --warn-soft:#3a2416; --danger:#ff8a80; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.banner .x{float:right;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 0 4px 8px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.in{color:var(--in)}
.ref{color:var(--accent)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:14px 10px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:2px}
.month b{font-weight:600;min-width:92px;text-align:center}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2)}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner b{font-weight:600}
.banner.warn{background:var(--warn-soft)}
.banner details{margin-top:6px}
.banner summary{cursor:pointer;color:var(--muted)}
.banner pre{white-space:pre-wrap;word-break:break-all;font-family:var(--num);font-size:12px;margin:6px 0 0}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.summary>div,.summary>button{background:var(--surface);padding:12px 14px;min-width:0}
.summary .lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.summary .val{font-size:19px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .wide{grid-column:1/-1}
.status-row{border:0;text-align:left;display:flex;align-items:center;gap:8px;font-size:13px;width:100%}
.status-row .go{margin-left:auto;color:var(--muted)}
button.status-row:hover{background:var(--surface2)}
.meter{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meter.over i{background:var(--warn)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 10px;margin-bottom:16px}
.cal .dow,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dow span{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .dow span:first-child{color:var(--danger)}
.day{border:0;background:transparent;border-radius:10px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.day .d{font-size:13px;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center}
.day.today .d{background:var(--fg);color:var(--bg);font-weight:600}
.day.sel{background:var(--accent-soft)}
.day .a{font-family:var(--num);font-size:10px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.blank{visibility:hidden}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.02em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface2)}
.cat{flex:none;width:36px;height:36px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.cat.tr{background:transparent;border:1px dashed var(--line)}
.cat.rf{background:var(--accent-soft);color:var(--accent)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .amt{text-align:right;white-space:nowrap}
.row .amt small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}
.who{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:600;margin-left:4px;vertical-align:1px}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:20px;background:var(--surface2);color:var(--muted);margin-left:4px;vertical-align:1px;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.solid{background:var(--accent);color:var(--accent-ink)}
.status-row .pill{margin-left:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 62px}
.flowchips .chip{padding:4px 10px;font-size:12px}
.bars{display:flex;flex-direction:column;gap:12px;padding:14px}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .track{height:8px;background:var(--surface2);border-radius:8px;margin-top:5px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar.unc .track i{background:var(--warn)}
.trend{display:grid;grid-template-columns:repeat(6,1fr);align-items:end;gap:10px;height:150px;padding:14px 14px 8px}
.trend .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.trend .col i{display:block;width:70%;max-width:34px;background:var(--surface2);border-radius:6px 6px 2px 2px;min-height:2px}
.trend .col.cur i{background:var(--accent)}
.trend .col span{font-size:11px;color:var(--muted)}
.trend .col em{font-style:normal;font-family:var(--num);font-size:10px;color:var(--muted);white-space:nowrap}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.total .v{font-size:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in-tabs{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;z-index:7;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 8px}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet h3{margin:0;font-size:17px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field>label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-width:0}
textarea.inp{min-height:140px;resize:vertical;line-height:1.7;font-family:var(--body)}
.inp.big{font-family:var(--num);font-size:24px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:600;width:100%;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn-row{display:flex;gap:8px;margin-top:6px}
.note{font-size:12px;color:var(--muted);margin:-4px 2px 12px}
.inst-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.inst-box dt{color:var(--muted)}
.inst-box dd{margin:0;text-align:right;font-family:var(--num)}
.prev .row{align-items:flex-start;gap:10px}
.prev .row select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:13px;max-width:92px}
.prev .row .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.prev .row.off{opacity:.5}
.prev .row.bad .t{white-space:normal}
.prev input[type=checkbox]{width:18px;height:18px;margin:9px 0 0;accent-color:var(--accent);flex:none}
.prev .s.wrap{white-space:normal}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--muted);background:var(--surface);display:block}
.drop input{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:600;padding:0;white-space:nowrap}
.card-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px}
.card-sec p{margin:0 0 8px}
.card-sec p:last-child{margin:0}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

const normKey=s=>String(s||"").toLowerCase().replace(/\s+/g,"").slice(0,60);

function addMonthsPay(dateStr,i,payDay){const d=parseYmd(dateStr);const y=d.getFullYear(),m=d.getMonth()+i;const last=new Date(y,m+1,0).getDate();return ymd(new Date(y,m,Math.min(payDay??d.getDate(),last)))}
function firstPayFor(purchase,acct){const pd=acct&&acct.payDay?acct.payDay:parseYmd(purchase).getDate();return addMonthsPay(purchase.slice(0,8)+"01",1,pd)}
function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(16)}

/* ===== PAMO common.py 이식 ===== */
function normalizeSms(t){return String(t).normalize("NFKC").replace(/\[\s*(?:Web발신|국제발신|국외발신|SMS)\s*\]/gi," ").replace(/\s+/g," ").trim()}
function intAmt(s){s=String(s).trim();return /^\d{1,3}(?:,\d{3})+$|^\d+$/.test(s)?parseInt(s.replace(/,/g,""),10):null}
function parseInst(s){s=s.trim();if(s==="일시불")return 0;const m=s.match(/^(\d{1,2})\s*개월$/);return m?+m[1]:null}
/* 연도 없는 MM/DD → 오늘 이전의 가장 가까운 날짜. 없는 날짜면 null */
function resolveDate(month,day,today){const t=parseYmd(today);for(let y=t.getFullYear();y>t.getFullYear()-4;y--){const d=new Date(y,month-1,day);if(d.getMonth()!==month-1||d.getDate()!==day)continue;if(d<=t)return ymd(d)}return null}
/* ===== PAMO masking.py 이식 ===== */
function maskSensitive(t,names){
  (names||[]).forEach(n=>{if(n)t=t.split(n).join("[이름]")});
  t=t.replace(/(?<![\d,.])(?:[\d*]{4}[- ]){3}[\d*]{3,4}(?![\d,])|(?<![\d,.])\d{13,19}(?![\d,])/g,"[카드번호]");
  t=t.replace(/(?<![\d*-])\d{2,6}-[\d*]{2,6}-[\d*]{4,8}(?:-[\d*]{1,4})?(?![\d*-])/g,"[계좌]");
  t=t.replace(/(?<![\d,.])\d{10,}(?![\d,])/g,"[숫자열]");
  return t.replace(/(?<![가-힣A-Za-z*])[가-힣]\*{1,2}[가-힣]?(?![가-힣*])/g,"[이름]");
}
function maskForAI(t){return maskSensitive(t).replace(/(?<![가-힣A-Za-z*])[가-힣]\*{1,2}[가-힣]?(?=님|고객|회원)/g,"[이름]").replace(/[가-힣]{2,4}(?=\s*(?:님|고객님|회원님)(?![가-힣]))/g,"[이름]").replace(/(카드|card)\s*\(\s*[\d*]{1,8}\s*\)/gi,"$1([카드번호])").replace(/(카드|card)\s*([\d*]{1,2}\*[\d*]{1,4})/gi,"$1[카드번호]")}

/* ===== PAMO parsers/shinhan.py 이식 (신한카드 승인·해외승인·취소) ===== */
function parseShinhanCard(text,today){
  const norm=normalizeSms(text);if(!norm.startsWith("신한"))return null;
  const h=norm.match(/^신한(?:카드)?\s*(?:\(\s*([^)]*?)\s*\))?\s*(해외승인|해외취소|승인취소|매출취소|승인|취소)?/);
  if(!h||!h[2])return null;
  const cancel=h[2].includes("취소"),cardRaw=h[1]||"",warn=[];
  const orig=norm.slice(h[0].length);let body=orig;
  const cm=body.match(/누적\s*(\d[\d,]*)\s*원/);if(cm)body=body.slice(0,cm.index)+" "+body.slice(cm.index+cm[0].length);
  let amt=null,inst=0,am=null,foreign="";
  const fm=body.match(/(\d[\d,]*(?:\.\d+)?)\s*([가-힣]{1,4}|[A-Z]{3})\s*\(\s*([A-Z]{2})\s*\)/);
  if(fm&&fm[2]!=="원"){am=fm;foreign=fm[1]+" "+(CUR[fm[2]]||fm[2])}
  else{const dm=body.match(/(\d[\d,]*)\s*원\s*(?:\(\s*([^)]*?)\s*\))?/);if(dm){am=dm;amt=intAmt(dm[1]);if(dm[2]!=null){const p=parseInst(dm[2]);if(p==null)warn.push("할부 표기를 읽지 못했어요("+dm[2]+")");else inst=p}else if(!cancel)warn.push("할부·일시불 정보를 확인하지 못했어요")}}
  const name=((am?body.slice(0,am.index):body).trim().split(/\s+/)[0])||"";
  let date=null,time="",merchant="";
  if(am){const tm=body.slice(am.index+am[0].length).match(/^\s*(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?\s*(.*)$/);if(tm){date=resolveDate(+tm[1],+tm[2],today);if(tm[3]!=null)time=pad(tm[3])+":"+tm[4];merchant=tm[5].trim()}}
  let head=norm.slice(0,h[0].length);if(/^\d+$/.test(cardRaw))head=head.replace(/\(\s*\d+\s*\)/,"([카드번호])");
  const raw=maskSensitive(head+(name?orig.replace(name,"[이름]"):orig));
  const base={kind:"sms",issuer:"신한카드",cardMsg:true,raw,hash:hashStr(raw)};
  if(foreign)return{...base,kind:"bad",msg:`해외 결제(${foreign})라 원화 금액을 알 수 없어요. 청구 금액이 나오면 한 건으로 입력하세요.`};
  if(!amt||!date)return{...base,kind:"bad",msg:!amt?"금액을 찾지 못했어요.":"날짜를 찾지 못했어요."};
  const type=cancel?"refund":"out";
  return{...base,type,amt,date,time,merchant:merchant||"(가맹점 없음)",cat:guessCat(merchant,type),inst:inst>1?inst:0,review:warn.length>0||!merchant,reviewNote:warn.join(" ")||(!merchant?"가맹점을 찾지 못했어요.":""),src:"sms"};
}
/* ===== PAMO parsers/shinhan_bank.py 이식 (확인된 형식은 출금뿐) ===== */
function parseShinhanBank(text,today){
  const norm=normalizeSms(text);if(!norm.startsWith("[신한은행]"))return null;
  const rest=norm.slice(6);
  if(!/(?<!\S)출금(?!\S)/.test(rest)||/(?<!\S)입금(?!\S)/.test(rest))return{kind:"unknown"};
  const acc=rest.match(/\[\s*((?=[\d*\-]*\d)[\d*\-]+)\s*\]/);
  const dm=rest.replace(acc?acc[0]:"","").match(/(?<![\d/])(\d{1,2})\/(\d{1,2})(?![\d/])/);
  const tm=rest.match(/(?<![\d:])(\d{1,2}):(\d{2})(?::(\d{2}))?(?![\d:])/);
  const amM=rest.match(/(?<![\d,.])(\d[\d,]*)\s*원/);
  const cp=rest.match(/\(\s*([^()]*?)\s*\)/);
  const amt=amM?intAmt(amM[1]):null,date=dm?resolveDate(+dm[1],+dm[2],today):null;
  let raw="[신한은행]"+rest;if(acc)raw=raw.replace(acc[0],"[계좌]");if(cp&&cp[1])raw=raw.replace(cp[0],"([이름])");raw=maskSensitive(raw);
  const base={kind:"sms",issuer:"신한은행",bankMsg:true,raw,hash:hashStr(raw)};
  if(!amt||!date)return{...base,kind:"bad",msg:!amt?"금액을 찾지 못했어요.":"날짜를 찾지 못했어요."};
  return{...base,type:"out",amt,date,time:tm?pad(tm[1])+":"+tm[2]:"",merchant:(cp&&cp[1])||"신한은행 출금",cat:"기타",inst:0,review:true,reviewNote:"은행 출금 문자예요. 생활비 지출인지, 내 다른 계좌로 옮긴 이체인지 확인하세요.",src:"sms"};
}

/* ================= ledger math ================= */
function entries(){
  const out=[];
  for(const t of allTx()){
    if(t.type==="out"&&t.inst&&t.inst.n>1){
      const n=t.inst.n,base=Math.floor(t.amt/n),acct=acctById(t.acct);
      for(let i=0;i<n;i++){const amt=i===n-1?t.amt-base*(n-1):base;out.push({...t,date:addMonthsPay(t.inst.first,i,acct&&acct.payDay),amt,instIdx:i+1,src:t})}
    }else out.push({...t,src:t});
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date)||(b.time||"").localeCompare(a.time||"")||(b.at||0)-(a.at||0));
}

function eff(e){if(e.type==="refund"&&e.cancelOf){const o=txById(e.cancelOf);if(o&&FLOW_KEYS.includes(normFlow(o.flow)))return{cat:o.cat||e.cat,flow:normFlow(o.flow)};if(o)return{cat:o.cat||e.cat,flow:normFlow(e.flow)}}return{cat:e.cat||"기타",flow:normFlow(e.flow)}}
/* PAMO summarize_month와 같은 규칙 */
function monthStats(month,ents){
  const r={inc:0,exp:0,byCat:{},byDay:{},byFlow:{},unc:0,uncAmt:0,uncNet:0,review:0,unconf:0,count:0,confIn:0,confExp:0,wedding:0};
  FLOW_KEYS.forEach(f=>r.byFlow[f]=0);
  for(const e of ents){
    if(ym(e.date)!==month)continue;r.count++;
    const conf=!!e.src.confirmed;if(e.src.review)r.review++;if(!conf)r.unconf++;
    const day=r.byDay[e.date]||(r.byDay[e.date]={i:0,o:0});
    if(e.type==="in"){r.inc+=e.amt;day.i+=e.amt;if(conf)r.confIn+=e.amt}
    else if(e.type==="out"||e.type==="refund"){
      const sg=e.type==="out"?e.amt:-e.amt,x=eff(e);r.exp+=sg;day.o+=sg;r.byCat[x.cat]=(r.byCat[x.cat]||0)+sg;
      if(FLOW_KEYS.includes(x.flow)){r.byFlow[x.flow]+=sg;if(conf)r.confExp+=sg}else{r.unc++;r.uncAmt+=e.amt;r.uncNet+=sg}
    }
  }
  r.status=!r.count?"no_data":(r.unc||r.review)?"needs_review":r.unconf?"provisional":"confirmed";
  r.classified=FLOW_KEYS.reduce((a,f)=>a+r.byFlow[f],0);
  return r;
}
function pamoSummary(month){

   net_cashflow:st.inc-st.classified,confirmed_income:st.confIn,confirmed_expense:st.confExp,unclassified_amount:st.uncAmt,unclassified_count:st.unc,
   unresolved_count:0,needs_review_count:st.review,transaction_count:st.count,generated_at:new Date().toISOString().replace(/\.\d{3}Z$/,"+00:00")};
}

/* ================= quick input parsing ================= */
function parseLine(line,base,today){
  let s=line.trim();if(!s)return null;let type="out",date=base,inst=0,m;
  if(/^[+＋]/.test(s)){type="in";s=s.slice(1).trim()}
  const bd=parseYmd(base);
  if(m=s.match(/^(오늘|어제|그제|그저께)\s*/)){const off={"오늘":0,"어제":1,"그제":2,"그저께":2}[m[1]];const t=parseYmd(today);date=ymd(new Date(t.getFullYear(),t.getMonth(),t.getDate()-off));s=s.slice(m[0].length)}
  else if(m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})\.?\s*/)){date=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;s=s.slice(m[0].length)}
  else if(m=s.match(/^(\d{1,2})[/.](\d{1,2})\.?\s+/)){date=resolveDate(+m[1],+m[2],today)||base;s=s.slice(m[0].length)}
  else if(m=s.match(/^(\d{1,2})일\s+/)){date=`${base.slice(0,8)}${pad(m[1])}`;s=s.slice(m[0].length)}
  if(m=s.match(/(\d{1,2})\s*개월(\s*할부)?|할부\s*(\d{1,2})(\s*개월)?/)){inst=+(m[1]||m[3]);s=s.replace(m[0]," ")}
  const re=/(-?[\d,]+(?:\.\d+)?)\s*(만|천)?\s*원?/g;let last=null,x;while((x=re.exec(s))){if(/\d/.test(x[1]))last=x}
  if(!last)return{raw:line,kind:"bad",msg:"금액을 찾지 못했어요."};
  let amt=parseFloat(last[1].replace(/,/g,""));if(last[2]==="만")amt*=1e4;if(last[2]==="천")amt*=1e3;
  if(amt<0){type="in";amt=-amt}
  let merchant=(s.slice(0,last.index)+" "+s.slice(last.index+last[0].length)).replace(/\s+/g," ").trim();
  if(type==="out"&&/(?:^|\s)(취소|환불)(?:\s|$)/.test(merchant)){type="refund";merchant=merchant.replace(/(?:^|\s)(취소|환불)(?=\s|$)/,"").trim()}
  if(type==="out"&&RULES_IN.some(([,r])=>r.test(merchant)))type="in";

}
const SMS_TAG=/^\s*\[(?:Web발신|국제발신|국외발신|SMS)\]\s*$/i;
const SMS_START=/^\s*(?:\[(?:Web발신|국제발신|국외발신|SMS)\]|\[[^\]\n]{0,12}(?:은행|카드|뱅크|증권)\]|신한(?:카드)?\s*(?:\(|해외|승인|매출|취소)|[A-Za-z가-힣]{1,8}(?:카드|은행)\s*(?:\(|\[|승인|결제|출금|입금|취소))/i;
/* 문자 덩어리와 빠른 입력 줄을 나눈다. 빈 줄은 항상 경계 */
function splitBlocks(text){
  const blocks=[];let cur=null;
  for(const line of text.split(/\r?\n/)){
    if(!line.trim()){cur=null;continue}
    if(SMS_START.test(line)){if(cur&&SMS_TAG.test(cur.text)){cur.text+="\n"+line;cur.shinhanCard=/^\s*신한/.test(line);continue}cur={sms:true,text:line,shinhanCard:/^\s*신한/.test(line)};blocks.push(cur);continue}
    if(cur){
      const closed=(cur.shinhanCard&&/\d\s*원/.test(cur.text))||(/은행/.test(cur.text)&&/\n\s*\([^()]*\)\s*$/.test(cur.text));
      if(!closed){cur.text+="\n"+line;continue}
      cur=null;
    }
    blocks.push({sms:false,text:line});
  }
  return blocks;
}
let quickText="",quickRows=[],quickAcct="",quickOv={},quickAI={},aiBusy=false;
function findDup(r){
  if(isDemo())return null;let poss=null;
  for(const t of S.tx.values()){
    if(r.hash&&t.hash===r.hash&&r.time&&t.date===r.date&&t.amt===r.amt)return{kind:"exact",t};
    if(!poss&&t.date===r.date&&t.amt===r.amt&&t.type!=="tr")poss={kind:"possible",t};
  }
  return poss;
}
function buildQuickRows(){
  const today=todayStr(),base=S.sel&&S.sel<=today?S.sel:today,out=[];
  for(const b of splitBlocks(quickText)){
    if(b.sms){
      const r=parseShinhanCard(b.text,today)||parseShinhanBank(b.text,today);
      if(r&&r.kind!=="unknown"){out.push({...r,key:"s"+b.text});continue}
      if(quickAI[b.text]){quickAI[b.text].forEach((x,j)=>out.push({...x,key:"a"+j+b.text}));continue}
      if(looksFinancial(b.text)){out.push({kind:"unknown",raw:b.text,masked:maskForAI(b.text),key:"u"+b.text});continue}
      if(!b.text.includes("\n")){const q=parseLine(b.text,base,today);if(q){out.push({...q,key:"q"+b.text});continue}}
      out.push({kind:"bad",raw:b.text.split("\n").find(l=>!SMS_TAG.test(l))||b.text,msg:"거래 문자로 보이지 않아요.",key:"b"+b.text});
    }else{const q=parseLine(b.text,base,today);if(q)out.push({...q,key:"q"+b.text})}
  }
  for(const r of out){
    if(r.kind==="bad"||r.kind==="unknown")continue;
    const ov=quickOv[r.key]||{};if(ov.cat)r.cat=ov.cat;r.catTouched=!!ov.cat;
    r.flow=guessFlow(r.merchant);r.dup=findDup(r);r.include=ov.include!==undefined?ov.include:!(r.dup&&r.dup.kind==="exact");
  }
  return out;
}

${JSON.stringify(items)}`;
  try{

        const bank=x.kind==="bank_withdrawal"||x.kind==="bank_deposit";
        row={kind:"ai",src:"ai-sms",issuer:x.issuer||"",cardMsg:!bank,bankMsg:bank,type,amt:Math.round(+x.amount),date,time:/^\d{1,2}:\d{2}$/.test(x.time||"")?x.time.padStart(5,"0"):"",merchant,cat:guessCat(merchant,type==="in"?"in":"out"),inst:type==="out"&&x.installment>1?+x.installment:0,raw,hash,
          review:bank,reviewNote:x.kind==="bank_withdrawal"?"은행 출금 문자예요. 생활비 지출인지, 내 다른 계좌로 옮긴 이체인지 확인하세요.":x.kind==="bank_deposit"?"입금 문자예요. 수입인지, 내 다른 계좌에서 옮긴 이체인지 확인하세요.":""};

/* 환불 연결 후보: 같은 날 이전의 지출, 가맹점이 같은 것 먼저 (자동 연결은 하지 않는다) */
function refundCandidates(d){
  const k=normKey(d.merchant);
  return [...S.tx.values()].filter(t=>t.type==="out"&&t.date<=d.date).map(t=>{const used=linkedRefundSum(t.id,d.id);return{t,left:t.amt-used,score:(normKey(t.merchant)===k&&k?2:0)+(t.acct===d.acct?1:0)}})
    .sort((a,b)=>b.score-a.score||b.t.date.localeCompare(a.t.date)).slice(0,40);
}
function linkedRefundSum(origId,exceptId){let s=0;for(const t of S.tx.values())if(t.type==="refund"&&t.cancelOf===origId&&t.id!==exceptId)s+=t.amt;return s}

function readOne(){

  const a=g("f-amt");if(a!==undefined)d.amt=parseInt(String(a).replace(/[^\d]/g,""),10)||0;
  const m=g("f-mer");if(m!==undefined)d.merchant=m;
  const c=g("f-cat");if(c!==undefined)d.cat=c;
  const ac=g("f-acct");if(ac!==undefined)d.acct=ac;
  const t=g("f-to");if(t!==undefined)d.to=t;
  const fl=g("f-flow");if(fl!==undefined)d.flow=fl;
  const o=g("f-orig");if(o!==undefined)d.cancelOf=o;
  const dt=g("f-date");if(dt)d.date=dt;
  const me=g("f-memo");if(me!==undefined)d.memo=me;
  const n=g("f-inst");if(n!==undefined)d.instN=+n;
  const f=g("f-first");if(f)d.instFirst=f;
}
function saveOne(){

  if(d.type==="tr"&&d.acct===d.to){toast("보내는 곳과 받는 곳이 같아요.");return}
  if(d.type==="refund"&&d.cancelOf){const o=S.tx.get(d.cancelOf);if(o){const used=linkedRefundSum(o.id,d.id);if(used+d.amt>o.amt){toast(`원래 결제(${won(o.amt)}원)보다 많이 환불될 수 없어요. 이미 연결된 환불 ${won(used)}원.`);return}if(o.date>d.date){toast("원래 결제가 환불 날짜보다 늦어요.");return}}}

  const t={id:d.id,type:d.type,amt:d.amt,date:d.date,memo:(d.memo||"").trim(),acct:d.acct,by:prev?prev.by||S.me||"":S.me||"",at:prev?prev.at||Date.now():Date.now(),src:prev?prev.src:"manual",raw:prev?prev.raw:undefined,hash:prev?prev.hash:undefined,time:prev?prev.time:undefined,confirmed:false,review:false};

function saveQuick(){

  });
  const rf=ok.filter(r=>r.type==="refund").length,rv=ok.filter(r=>r.review).length;
  quickText="";quickRows=[];quickOv={};quickAI={};S.sel=ok[0].date;S.month=ym(ok[0].date);closeSheet();render();
  toast(`${ok.length}건을 저장했어요.`+(rf?` 환불 ${rf}건은 눌러서 원래 결제에 연결하세요.`:rv?` 확인 필요 ${rv}건이 있어요.`:""));
}
async function readShot(file){
  const st=$("#shotStatus");if(!file||!S.sample)return;
  st.innerHTML=`<p class="note">캡처를 읽는 중이에요…</p>`;
  const today=todayStr();
  const prompt=`이 이미지는 한국 은행/카드/가계부 앱(토스, 뱅크샐러드 등)의 거래 내역 캡처입니다. 보이는 거래를 모두 추출해 JSON 배열로만 답하세요. 각 항목: {"date":"YYYY-MM-DD","merchant":"가맹점 또는 내용","amount":양의 정수(원),"type":"out" 또는 "in" 또는 "refund","installment":할부 개월 수(없으면 0)}. 연도가 안 보이면 오늘(${today}) 이전의 가장 가까운 날짜로 하고, 날짜가 전혀 없으면 "${today}"를 쓰세요. 입금은 "in", 결제·출금은 "out", 취소·환불은 "refund"입니다.`;
  try{
    const res=await S.sample.json(prompt,{images:[file],modelTier:"default"});
    const arr=Array.isArray(res)?res:(res&&Array.isArray(res.items)?res.items:[]);
    if(!arr.length){st.innerHTML=`<p class="note">내역을 찾지 못했어요. 거래 목록이 보이게 다시 캡처해 주세요.</p>`;return}
    quickText=arr.map(x=>{const dd=String(x.date||today);return `${/^\d{4}-\d{2}-\d{2}$/.test(dd)?dd:today} ${x.type==="in"?"+":""}${String(x.merchant||"").replace(/\d/g,"").trim()}${x.type==="refund"?" 환불":""} ${Math.abs(parseInt(x.amount,10)||0)}${x.installment>1?" "+x.installment+"개월":""}`}).join("\n");
    addMode="quick";renderAdd();toast(`${arr.length}건을 읽었어요. 확인 후 저장하세요.`);
  }catch(e){st.innerHTML=`<p class="note">${e&&e.code==="not_granted"?"Claude 사용 허용이 필요해요. 권한을 허용한 뒤 다시 시도하세요.":e&&e.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 시도하세요.":"캡처를 읽지 못했어요. 다른 이미지로 시도해 주세요."}</p>`}
}
/* 미분류·확인 필요 정리 (PAMO 월별 검토 흐름) */
function openClassify(){
  const ents=entries().filter(e=>ym(e.date)===S.month);const seen=new Set(),items=[];
  for(const e of ents){if(seen.has(e.src.id))continue;const x=eff(e);if(((e.type==="out"||e.type==="refund")&&!x.flow)||e.src.review){seen.add(e.src.id);items.push(e)}}
  const st=monthStats(S.month,entries());
  const body=items.length?`<div class="list">${items.map(e=>`${rowHtml(e)}${(e.type==="out"||e.type==="refund")&&!eff(e).flow?`<div class="flowchips">${FLOWS.map(([k,s])=>`<button class="chip" data-setflow="${esc(e.src.id)}" data-flow="${esc(k)}">${s}</button>`).join("")}</div>`:""}`).join("")}</div>
    <p class="note" style="margin-top:10px">'확인 필요'는 눌러서 내용을 확인한 뒤 저장하세요. 고른 지출 성격은 같은 가맹점에 다음부터 자동으로 적용돼요.</p>`
    :`<div class="list"><div class="empty">${+S.month.slice(5)}월에 정리할 거래가 없어요.</div></div>`;
  const confirm=st.status==="provisional"?`<button class="btn" data-confirm-month="1" style="margin-top:12px">${+S.month.slice(5)}월 장부 확정하기</button>`:"";
  openSheet(`<header><h3>${+S.month.slice(5)}월 장부 정리</h3><button class="icon-btn" data-close="1" aria-label="닫기">✕</button></header>${body}${confirm}`);
}
function confirmMonth(){
  if(isDemo()){toast("예시 장부예요. 거래를 기록한 뒤 확정할 수 있어요.");return}
  const ids=new Set(entries().filter(e=>ym(e.date)===S.month).map(e=>e.src.id));let n=0;
  ids.forEach(id=>{const t=S.tx.get(id);if(t&&!t.confirmed){putTx({...t,confirmed:true},true);n++}});
  closeSheet();render();toast(`${+S.month.slice(5)}월 장부를 확정했어요. 수정하면 다시 잠정으로 바뀌어요.`);
}
async function exportPamo(){
  if(isDemo()){toast("예시 장부예요. 거래를 기록한 뒤 내보낼 수 있어요.");return}
  if(!S.downloads)return;
  const data=JSON.stringify(pamoSummary(S.month),null,2)+"\n";
  try{await S.downloads.save({filename:`monthly_summary_${S.month}.json`,data});toast("요약 파일을 만들었어요.")}
  catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rate_limited"?"잠시 후 다시 시도하세요.":"파일을 저장하지 못했어요.")}
}
function openAcct(id){
  const s=settings();const a=id?s.accounts.find(x=>x.id===id):{id:uid(),name:"",kind:"bank",init:0,payDay:14};
  const used=id&&[...S.tx.values()].some(t=>t.acct===id||t.to===id);
  openSheet(`<header><h3>${id?"계좌 수정":"계좌 추가"}</h3><button class="icon-btn" data-close="1" aria-label="닫기">✕</button></header>
  <div class="field"><label for="a-name">이름</label><input class="inp" id="a-name" value="${esc(a.name)}" placeholder="예: 생활비 통장" autofocus></div>
  <div class="two"><div class="field"><label for="a-kind">종류</label><select class="inp" id="a-kind">${[["bank","통장"],["card","카드"],["cash","현금"]].map(([k,l])=>`<option value="${k}" ${a.kind===k?"selected":""}>${l}</option>`).join("")}</select></div>
  <div class="field"><label for="a-init">시작 잔액</label><input class="inp num" id="a-init" inputmode="numeric" value="${a.init?won(a.init):""}" placeholder="0"></div></div>
  <div class="field"><label for="a-pay">카드 결제일 (카드만)</label><input class="inp" id="a-pay" type="number" min="1" max="31" value="${a.payDay||14}"></div>
  <button class="btn" data-asave="${esc(a.id)}">저장</button>
  ${id?`<div class="btn-row"><button class="btn danger" data-adel="${esc(a.id)}" ${used?"disabled":""}>${used?"사용 중인 계좌는 삭제할 수 없어요":"삭제"}</button></div>`:""}`);
}

/* ================= files ================= */
const isPhone=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const isStandalone=()=>!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
async function saveFile(name,text,type){
  const blob=new Blob([text],{type});
  if(isPhone&&navigator.canShare){try{const f=new File([blob],name,{type});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}}catch(e){if(e&&e.code==="declined")throw e}}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function lastBackup(){try{return localStorage.getItem(BKEY)||""}catch(e){return""}}
async function backup(){
  if(!S.tx.size){toast("아직 기록한 거래가 없어요.");return}
  const data=JSON.stringify({app:"moajangbu",version:1,exportedAt:new Date().toISOString(),tx:Object.fromEntries(S.tx),settings:S.settings,merchants:S.merchants,flows:S.flowLearn},null,1);
  try{await saveFile(`모아장부-백업-${todayStr()}.json`,data,"application/json");try{localStorage.setItem(BKEY,todayStr())}catch(e){}render();toast("백업 파일을 만들었어요. 파일 앱이나 메신저 '나에게 보내기'에 보관하세요.")}
  catch(e){if(!(e&&e.code==="declined"))toast("백업 파일을 만들지 못했어요.")}
}
let pendingRestore=null;
function readRestore(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast("모아장부 백업 파일이 아니에요.");return}
    if(!d||d.app!=="moajangbu"||typeof d.tx!=="object"){toast("모아장부 백업 파일이 아니에요.");return}
    pendingRestore=d;const n=Object.keys(d.tx).length;
    openSheet(`<header><h3>백업 불러오기</h3><button class="icon-btn" data-close="1" aria-label="닫기">✕</button></header>
    <div class="banner warn"><b>지금 장부를 백업 내용으로 바꿔요.</b> 이 휴대폰에 있는 거래 ${S.tx.size}건은 사라지고, 백업의 거래 ${n}건으로 바뀌어요.</div>
    <dl class="inst-box"><dt>백업 날짜</dt><dd>${esc(String(d.exportedAt||"").slice(0,10))}</dd><dt>거래</dt><dd>${n}건</dd><dt>계좌·카드</dt><dd>${(d.settings&&d.settings.accounts||[]).length||3}개</dd></dl>
    <button class="btn" data-restore-apply="1">불러오기</button>`)};
  r.onerror=()=>toast("파일을 읽지 못했어요.");r.readAsText(file);
}
function applyRestore(){
  const d=pendingRestore;if(!d)return;
  S.tx=new Map(Object.entries(d.tx));S.settings=d.settings||null;S.merchants=d.merchants||{};S.flowLearn=d.flows||{};
  pendingRestore=null;localSave();closeSheet();render();toast(`거래 ${S.tx.size}건을 불러왔어요.`);
}

/* ================= toast ================= */
let toastTimer;
function toast(msg,action,fn){clearTimeout(toastTimer);document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:""}`;document.body.appendChild(el);if(action)el.querySelector("button").onclick=()=>{el.remove();fn()};toastTimer=setTimeout(()=>el.remove(),action?7000:2800)}

/* ================= events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,#scrim");if(!t)return;
  if(t.id==="scrim"){if(e.target===t){closeSheet();draft=null}return}
  const ds=t.dataset;
  if(ds.tab){S.tab=ds.tab;render();window.scrollTo(0,0)}
  else if(ds.mon){const d=parseYmd(S.month+"-01");d.setMonth(d.getMonth()+ +ds.mon);S.month=ymd(d).slice(0,7);S.sel=S.month===ym(todayStr())?todayStr():S.month+"-01";render()}
  else if(ds.day){S.sel=ds.day;render()}
  else if(ds.cf!==undefined){S.catFilter=ds.cf;render()}
  else if(t.id==="fab"){draft=null;if(addMode==="shot")addMode="quick";renderAdd()}
  else if(ds.close){closeSheet();draft=null}
  else if(ds.am){if(ds.am==="one"&&!draft)draft=newDraft();addMode=ds.am;renderAdd()}
  else if(ds.ty){readOne();draft.type=ds.ty;if(!draft.catTouched)draft.cat=guessCat(draft.merchant,ds.ty==="in"?"in":"out");if(ds.ty==="in"||ds.ty==="tr"){const a=acctById(draft.acct);if(a&&a.kind==="card")draft.acct=(settings().accounts.find(x=>x.kind!=="card")||{}).id}renderAdd()}
  else if(ds.osave)saveOne();
  else if(ds.odel){if(ds.armed){const id=draft.id;[...S.tx.values()].filter(r=>r.type==="refund"&&r.cancelOf===id).forEach(r=>putTx({...r,cancelOf:""},true));delTx(id);draft=null;closeSheet();toast("삭제했어요.")}else{ds.armed="1";t.textContent="한 번 더 누르면 삭제돼요"}}
  else if(ds.qsave)saveQuick();
  else if(ds.aiRead)aiReadUnknown();
  else if(ds.classify)openClassify();
  else if(ds.confirmMonth)confirmMonth();
  else if(ds.export)exportPamo();
  else if(ds.backup)backup();
  else if(ds.restoreApply)applyRestore();
  else if(ds.tipClose){try{localStorage.setItem(TKEY,"1")}catch(e){}render()}
  else if(ds.setflow){if(isDemo()){toast("예시 거래예요. + 버튼으로 첫 거래를 기록해 보세요.");return}const x=S.tx.get(ds.setflow);if(!x)return;putTx({...x,flow:ds.flow,confirmed:false},true);if(x.merchant)learnFlow(x.merchant,ds.flow);render();openClassify()}
  else if(ds.edit){if(isDemo()){toast("예시 거래예요. + 버튼으로 첫 거래를 기록해 보세요.");return}const x=S.tx.get(ds.edit);if(!x)return;draft={...x,merchant:x.merchant||"",cat:x.cat||"",flow:normFlow(x.flow),memo:x.memo||"",to:x.to||"",cancelOf:x.cancelOf||"",instN:x.inst?x.inst.n:0,instFirst:x.inst?x.inst.first:"",catTouched:false,flowTouched:false};addMode="one";renderAdd()}
  else if(ds.acct)openAcct(ds.acct);
  else if(ds.acctNew)openAcct(null);
  else if(ds.asave){const s=JSON.parse(JSON.stringify(settings()));const name=$("#a-name").value.trim();if(!name){toast("이름을 입력해 주세요.");return}const a={id:ds.asave,name,kind:$("#a-kind").value,init:parseInt($("#a-init").value.replace(/[^\d-]/g,""),10)||0};if(a.kind==="card")a.payDay=Math.min(31,Math.max(1,+$("#a-pay").value||14));const i=s.accounts.findIndex(x=>x.id===a.id);if(i>=0)s.accounts[i]=a;else s.accounts.push(a);putSettings(s);closeSheet();toast("저장했어요.")}
  else if(ds.adel){const s=JSON.parse(JSON.stringify(settings()));s.accounts=s.accounts.filter(x=>x.id!==ds.adel);putSettings(s);closeSheet();toast("삭제했어요.")}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}
  else if(t.id==="qt"){quickText=t.value;refreshQuick()}
  else if(t.id==="f-amt"){const raw=t.value.replace(/[^\d]/g,"");draft.amt=parseInt(raw,10)||0;t.value=raw?won(draft.amt):"";if(draft.instN>1){readOne();renderAdd();const n=$("#f-amt");n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  else if(t.id==="f-mer"){draft.merchant=t.value;if(!draft.catTouched){const c=guessCat(t.value,draft.type==="in"?"in":"out");draft.cat=c;const sel=$("#f-cat");if(sel)sel.innerHTML=catOptions(draft.type==="in"?"in":"out",c)}if(!draft.flowTouched){const f=guessFlow(t.value);if(f){draft.flow=f;const sel=$("#f-flow");if(sel)sel.value=f}}}
  else if(t.id==="a-init"||t.id==="budget"){const raw=t.value.replace(/[^\d]/g,"");t.value=raw?won(+raw):""}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="f-cat"){draft.cat=t.value;draft.catTouched=true}
  else if(t.id==="f-flow"){draft.flow=t.value;draft.flowTouched=true}
  else if(t.id==="f-acct"||t.id==="f-date"){readOne();draft.instFirst="";renderAdd()}
  else if(t.id==="f-inst"||t.id==="f-first"||t.id==="f-orig"){readOne();renderAdd()}
  else if(t.dataset.qcat!==undefined){const r=quickRows[+t.dataset.qcat];if(r){quickOv[r.key]={...(quickOv[r.key]||{}),cat:t.value}}}
  else if(t.dataset.qinc!==undefined){const r=quickRows[+t.dataset.qinc];if(r){quickOv[r.key]={...(quickOv[r.key]||{}),include:t.checked};refreshQuick()}}
  else if(t.id==="qa")quickAcct=t.value;
  else if(t.id==="budget"){const s=JSON.parse(JSON.stringify(settings()));s.budget=parseInt(t.value.replace(/[^\d]/g,""),10)||0;putSettings(s);toast("예산을 저장했어요.")}
  else if(t.id==="shot")readShot(t.files&&t.files[0]);
  else if(t.id==="restore"){readRestore(t.files&&t.files[0]);t.value=""}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim")){closeSheet();draft=null}});

boot();
})();
</script>
